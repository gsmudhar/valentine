<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anchal, will you be my Valentine? 💘</title>

  <style>
    :root{
      --pink-bg:#ffb3c7;
      --pink-bg-2:#ffd1dc;
      --card:#ffffff;
      --text:#121225;
      --muted:#5b5b75;
      --yes:#ff4d6d;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 700px at 50% 20%, var(--pink-bg-2), var(--pink-bg) 60%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      overflow-x:hidden;
      overflow-y:auto;
      padding: 20px 0;
    }

    .card{
      width:min(820px, 92vw);
      background:var(--card);
      border-radius:28px;
      padding:34px 24px 26px;
      box-shadow:0 30px 80px rgba(0,0,0,.18);
      position:relative;
    }

    #reset{
      position:absolute;
      top:14px;
      right:14px;
      padding:8px 12px;
      border-radius:12px;
      font-weight:700;
      background:#fff;
      border:1px solid rgba(0,0,0,.15);
      cursor:pointer;
    }

    h1{
      text-align:center;
      font-size:clamp(28px,4.4vw,52px);
      margin:0 0 10px;
    }

    .subtitleBox{
      background:#fff;
      border-radius:14px;
      padding:10px 14px;
      margin:0 auto 16px;
      width:fit-content;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
    }

    #subtitle{
      margin:0;
      font-size:17px;
      color:var(--muted);
      font-weight:600;
    }

    .catWrap{
      display:flex;
      justify-content:center;
      margin-bottom:12px;
    }

    .catWrap img{
      width:min(240px,70vw);
      border-radius:18px;
      box-shadow:0 15px 40px rgba(0,0,0,.12);
    }

    .stage{
      position:relative;
      height:200px;
      overflow:hidden;
    }

    .btn{
      padding:14px 18px;
      border-radius:16px;
      font-weight:800;
      border:1px solid rgba(0,0,0,.15);
      background:#fff;
      cursor:pointer;
      box-shadow:0 12px 30px rgba(0,0,0,.12);
    }

    #yes{
      background:linear-gradient(180deg,#ff4d6d,#ff8fa3);
      color:#fff;
      border:none;
    }

    #no{
      position:absolute;
      left:60%;
      top:55%;
      transform:translate(-50%,-50%);
      touch-action:none;
    }

    .controls{
      display:flex;
      justify-content:center;
      margin-top:10px;
    }

    .success{
      display:none;
      text-align:center;
      margin-top:20px;
    }

    .vidwrap{
      max-width:560px;
      margin:0 auto;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 20px 50px rgba(0,0,0,.2);
    }

    .vidwrap img{
      width:100%;
      display:block;
    }

    .small{
      margin-top:14px;
      font-size:16px;
      font-weight:600;
      white-space:pre-line;
    }

    @media (max-width:600px){
      .stage{ height:150px; }
      h1{ font-size:32px; }
    }
  </style>
</head>

<body>
  <div class="card">
    <button id="reset">Reset</button>

    <h1>Anchal, will you be my Valentine? 💘</h1>

    <div class="subtitleBox">
      <p id="subtitle">Choose wisely 🙂</p>
    </div>

    <div class="catWrap" id="catWrap">
      <img src="cat.gif" alt="please cat">
    </div>

    <div class="stage" id="stage">
      <button class="btn" id="no">No</button>
    </div>

    <div class="controls">
      <button class="btn" id="yes">Yes</button>
    </div>

    <div class="success" id="success">
      <h2>Yesss 🥰</h2>

      <div class="vidwrap">
        <img src="anchal.gif" alt="dancing tribute">
      </div>

      <div class="small">
okay so… ur dancing lives rent-free in my head 😭
happy valentine’s day, anchal ❤️
love, sunny
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const resetBtn = document.getElementById("reset");
    const success = document.getElementById("success");
    const subtitle = document.getElementById("subtitle");
    const catWrap = document.getElementById("catWrap");

    const NO_LINES = [
      "No",
      "Wait… really?",
      "Try again 😌",
      "Be serious 😭",
      "Anchal…",
      "Ok you’re just clicking for fun",
      "C’mon pls 🥺"
    ];
    let noCount = 0;

    function placeNo(x,y){
      const s=stage.getBoundingClientRect();
      const b=noBtn.getBoundingClientRect();
      const pad=8;
      noBtn.style.left=Math.min(Math.max(x,pad),s.width-b.width-pad)+"px";
      noBtn.style.top=Math.min(Math.max(y,pad),s.height-b.height-pad)+"px";
    }

    function dodge(cx,cy){
      const s=stage.getBoundingClientRect();
      noCount=(noCount+1)%NO_LINES.length;
      noBtn.textContent=NO_LINES[noCount];
      placeNo(Math.random()*(s.width-80),Math.random()*(s.height-40));
      subtitle.textContent="Hmm… interesting choice 😉";
    }

    stage.addEventListener("mousemove",e=>dodge(e.clientX-stage.getBoundingClientRect().left,e.clientY-stage.getBoundingClientRect().top));
    noBtn.addEventListener("touchstart",e=>{dodge(0,0);e.preventDefault();});

    yesBtn.onclick=()=>{
      success.style.display="block";
      catWrap.style.display="none";
      subtitle.textContent="Correct answer 😇";
      success.scrollIntoView({behavior:"smooth"});
    };

    resetBtn.onclick=()=>{
      success.style.display="none";
      catWrap.style.display="flex";
      subtitle.textContent="Choose wisely 🙂";
      noBtn.textContent="No";
      noCount=0;
      window.scrollTo({top:0,behavior:"smooth"});
    };
  </script>
</body>
</html>
