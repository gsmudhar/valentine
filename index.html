<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anchal, will you be my Valentine? 💘</title>
  <style>
    :root{
      --pink-bg: #ffb3c7;
      --pink-bg-2:#ffd1dc;
      --card: rgba(255,255,255,.92);
      --stroke: rgba(0,0,0,.08);
      --text:#121225;
      --muted:#5b5b75;
      --yes:#ff4d6d;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background: radial-gradient(1200px 700px at 50% 20%, var(--pink-bg-2), var(--pink-bg) 60%);
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      overflow:hidden;
      padding: 18px 0;
    }

    .card{
      width:min(820px, 92vw);
      border:1px solid var(--stroke);
      background: var(--card);
      border-radius:26px;
      padding:34px 24px 26px;
      box-shadow: 0 30px 90px rgba(0,0,0,.18);
      position:relative;
      overflow:hidden;
    }

    /* Reset button in corner */
    #reset{
      position:absolute;
      top:14px;
      right:14px;
      padding:10px 12px;
      border-radius:14px;
      font-weight:800;
      font-size: 14px;
      opacity:.85;
      z-index: 5;
      border:1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.75);
      color: var(--text);
      cursor: pointer;
    }
    #reset:hover{ opacity:1; }

    h1{
      margin:0 0 10px;
      font-size: clamp(28px, 4.4vw, 54px);
      letter-spacing:-.02em;
      text-align:center;
    }

    /* White box for the subtitle text */
    .subtitleBox{
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 18px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.85);
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align:center;
    }
    #subtitle{
      margin:0;
      color: var(--muted);
      line-height:1.4;
      font-size: 17px;
      font-weight: 650;
    }

    /* Cat GIF on front page */
    .catWrap{
      display:flex;
      justify-content:center;
      margin: 8px 0 10px;
    }
    .catWrap img{
      width: min(240px, 70vw);
      height: auto;
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.6);
      box-shadow: 0 18px 55px rgba(0,0,0,.10);
    }

    /* Invisible stage for no button movement */
    .stage{
      position:relative;
      height:230px;
      margin-top:6px;
      overflow:hidden;
    }

    .btn{
      border:1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.70);
      color: var(--text);
      padding:14px 18px;
      border-radius:16px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      transition: transform .08s ease, box-shadow .2s ease, border-color .2s ease;
      box-shadow: 0 16px 35px rgba(0,0,0,.10);
    }
    .btn:active{ transform: scale(.98); }

    #yes{
      background: linear-gradient(180deg, rgba(255,77,109,.55), rgba(255,77,109,.25));
      border-color: rgba(255,77,109,.55);
      color: #fff;
      text-shadow: 0 1px 0 rgba(0,0,0,.12);
    }
    #yes:hover{ border-color: rgba(255,77,109,.95); }

    #no{
      position:absolute;
      left: 60%;
      top: 55%;
      transform: translate(-50%,-50%);
      touch-action: none;
      border-radius: 18px;
    }

    .controls{
      display:flex;
      justify-content:center;
      gap:14px;
      margin-top:10px;
    }

    .success{
      display:none;
      margin-top:18px;
      text-align:center;
    }
    .success h2{
      margin:0 0 12px;
      font-size: clamp(22px, 3.2vw, 34px);
    }
    .vidwrap{
      border:1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.75);
      border-radius: 18px;
      overflow:hidden;
      width:min(560px, 100%);
      margin: 0 auto;
      box-shadow: 0 18px 60px rgba(0,0,0,.14);
    }
    .gif{
      width:100%;
      display:block;
    }
    .fade-in {
      animation: fadeIn 0.6s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity:0; transform: translateY(6px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .small{
      color: #3d3d58;
      margin-top:12px;
      font-size: 16px;
      white-space: pre-line;
      font-weight: 650;
    }

    .footer{
      margin-top:18px;
      text-align:center;
      color: rgba(0,0,0,.45);
      font-size: 13px;
      font-weight: 650;
    }

    canvas{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.95;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <canvas id="fx"></canvas>

    <button id="reset" aria-label="Reset">Reset</button>

    <h1 id="title"></h1>

    <div class="subtitleBox">
      <p id="subtitle">Choose wisely 🙂</p>
    </div>

    <!-- Front page cat -->
    <div class="catWrap" id="catWrap">
      <img src="cat.gif" alt="please cat" />
    </div>

    <div class="stage" id="stage">
      <button class="btn" id="no" aria-label="No">No</button>
    </div>

    <div class="controls">
      <button class="btn" id="yes" aria-label="Yes">Yes</button>
    </div>

    <div class="success" id="success">
      <h2>Yesss 🥰</h2>

      <div class="vidwrap">
        <!-- Upload your tribute GIF and name it: anchal.gif -->
        <img id="valGif" class="gif fade-in" src="anchal.gif" alt="tribute gif" />
      </div>

      <div class="small" id="message"></div>
    </div>

    <div class="footer">made with love (and a little cheating)</div>
  </div>

  <script>
    // ====== Customize these ======
    const HER_NAME = "Anchal";
    const YOUR_NAME = "Sunny";
    const WIN_MESSAGE = `here's a tribute to ur excellent dancing haha
happy valentines day!
love ${YOUR_NAME.toLowerCase()}`;
    // Make sure you upload:
    //  - cat.gif  (front page)
    //  - anchal.gif (after yes)
    // ============================

    document.getElementById("title").textContent = `${HER_NAME}, will you be my Valentine? 💘`;
    document.getElementById("message").textContent = WIN_MESSAGE;

    const stage = document.getElementById("stage");
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const resetBtn = document.getElementById("reset");
    const success = document.getElementById("success");
    const subtitle = document.getElementById("subtitle");
    const catWrap = document.getElementById("catWrap");

    // Looping "No" lines (no stalling)
    const NO_LINES = [
      "No",
      "Wait… really?",
      "Try again 😌",
      "Be serious 😭",
      "Anchal…",
      "Ok you’re just clicking for fun",
      "One more time? 😇",
      "C’mon pls 🥺"
    ];
    let noCount = 0;

    function placeNoButton(x, y){
      const s = stage.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      const pad = 8;
      const maxX = s.width - b.width - pad;
      const maxY = s.height - b.height - pad;

      const nx = Math.min(Math.max(x, pad), maxX);
      const ny = Math.min(Math.max(y, pad), maxY);

      noBtn.style.left = nx + "px";
      noBtn.style.top  = ny + "px";
      noBtn.style.transform = "translate(0,0)";
    }

    function randomSpotFarFrom(cursorX, cursorY){
      const s = stage.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const pad = 8;

      const spots = [];
      for(let i=0;i<26;i++){
        const x = pad + Math.random() * (s.width - b.width - pad*2);
        const y = pad + Math.random() * (s.height - b.height - pad*2);
        const dist = Math.hypot(x - cursorX, y - cursorY);
        spots.push({x,y,dist});
      }
      spots.sort((a,b)=>b.dist - a.dist);
      return spots[0];
    }

    function nextNoText(){
      noCount = (noCount + 1) % NO_LINES.length; // <-- loops forever
      noBtn.textContent = NO_LINES[noCount];
    }

    function maybeDodge(clientX, clientY){
      const s = stage.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      const cx = clientX - s.left;
      const cy = clientY - s.top;

      const bx = (b.left - s.left) + b.width/2;
      const by = (b.top  - s.top)  + b.height/2;

      const dist = Math.hypot(cx - bx, cy - by);
      const DODGE_RADIUS = 95;

      if(dist < DODGE_RADIUS){
        nextNoText();
        const spot = randomSpotFarFrom(cx, cy);
        placeNoButton(spot.x, spot.y);
        subtitle.textContent = "Hmm… interesting choice 😉";
      }
    }

    // Desktop
    stage.addEventListener("mousemove", (e) => maybeDodge(e.clientX, e.clientY));

    // Mobile
    noBtn.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      maybeDodge(t.clientX, t.clientY);
      e.preventDefault();
    }, {passive:false});

    // If they somehow click No
    noBtn.addEventListener("click", () => {
      subtitle.textContent = "Nice try 😂";
      nextNoText();
      const s = stage.getBoundingClientRect();
      placeNoButton(10 + Math.random()*(s.width-120), 10 + Math.random()*(s.height-80));
    });

    yesBtn.addEventListener("click", () => {
      success.style.display = "block";
      subtitle.textContent = "Correct answer 😇";
      burst();
      // hide cat once she says yes
      if (catWrap) catWrap.style.display = "none";
      success.scrollIntoView({behavior:"smooth", block:"start"});
    });

    resetBtn.addEventListener("click", () => {
      success.style.display = "none";
      subtitle.textContent = "Choose wisely 🙂";
      noCount = 0;
      noBtn.textContent = NO_LINES[0];
      placeNoButton(stage.clientWidth*0.60, stage.clientHeight*0.55);
      clearConfetti();
      if (catWrap) catWrap.style.display = "flex";
      window.scrollTo({top:0, behavior:"smooth"});
    });

    requestAnimationFrame(() => {
      placeNoButton(stage.clientWidth*0.60, stage.clientHeight*0.55);
    });

    // ---- confetti ----
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    const card = document.getElementById("card");
    let W=0,H=0, conf=[];
    function resize(){
      const r = card.getBoundingClientRect();
      canvas.width = Math.floor(r.width * devicePixelRatio);
      canvas.height = Math.floor(r.height * devicePixelRatio);
      canvas.style.width = r.width + "px";
      canvas.style.height = r.height + "px";
      W = canvas.width; H = canvas.height;
      ctx.setTransform(1,0,0,1,0,0);
    }
    window.addEventListener("resize", resize);
    resize();

    function burst(){
      conf = [];
      const colors = ["#ff4d6d","#ffd166","#8ecae6","#cdb4db","#a7f3d0","#ffffff"];
      for(let i=0;i<170;i++){
        conf.push({
          x: W/2 + (Math.random()-0.5)*80,
          y: H*0.22 + (Math.random()-0.5)*40,
          vx: (Math.random()-0.5)*11,
          vy: Math.random()*-10 - 4,
          g: 0.26 + Math.random()*0.12,
          s: 3 + Math.random()*4.5,
          a: 1,
          c: colors[(Math.random()*colors.length)|0],
          r: Math.random()*Math.PI
        });
      }
    }
    function clearConfetti(){ conf = []; }

    function tick(){
      ctx.clearRect(0,0,W,H);
      for(const p of conf){
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.r += 0.12;
        p.a *= 0.993;
        ctx.globalAlpha = p.a;
        ctx.fillStyle = p.c;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.r);
        ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*1.6);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
