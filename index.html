<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anchal, will you be my Valentine? 💘</title>
  <style>
    :root{
      --bg1:#0b0b12; --bg2:#1a1033;
      --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.14);
      --text:#f7f7ff; --muted:#c7c7ee;
      --yes:#ff4d6d;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background: radial-gradient(1200px 700px at 50% 20%, var(--bg2), var(--bg1) 60%);
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      overflow:hidden;
    }
    .card{
      width:min(820px, 92vw);
      border:1px solid var(--stroke);
      background: var(--card);
      border-radius:24px;
      padding:32px 22px 26px;
      box-shadow: 0 30px 90px rgba(0,0,0,.55);
      backdrop-filter: blur(10px);
      position:relative;
    }

    /* Reset button in the corner */
    #reset{
      position:absolute;
      top:16px;
      right:16px;
      padding:10px 12px;
      border-radius:14px;
      font-weight:800;
      font-size: 14px;
      opacity:.9;
    }

    h1{
      margin:10px 0 8px;
      font-size: clamp(28px, 4.2vw, 52px);
      letter-spacing:-.02em;
      text-align:center;
    }
    p{
      margin:0 0 18px;
      text-align:center;
      color:var(--muted);
      line-height:1.5;
      font-size: 18px;
    }

    /* Invisible stage: keeps "No" constrained without showing a box */
    .stage{
      position:relative;
      height:240px;
      margin-top:18px;

      /* remove the box visuals */
      border:none;
      background: transparent;
      overflow:hidden;
    }

    .btn{
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding:14px 18px;
      border-radius:16px;
      font-weight:800;
      cursor:pointer;
      user-select:none;
      transition: transform .08s ease, border-color .2s ease, background .2s ease;
    }
    .btn:active{ transform: scale(.98); }

    #yes{
      background: linear-gradient(180deg, rgba(255,77,109,.45), rgba(255,77,109,.18));
      border-color: rgba(255,77,109,.65);
    }
    #yes:hover{ border-color: rgba(255,77,109,.95); }

    /* No moves around inside the stage */
    #no{
      position:absolute;
      left: 58%;
      top: 55%;
      transform: translate(-50%,-50%);
      touch-action: none;
      border-radius: 18px;
    }

    .controls{
      display:flex;
      justify-content:center;
      gap:14px;
      margin-top:10px;
    }

    /* Video reveal */
    .success{
      display:none;
      margin-top:18px;
      text-align:center;
    }
    .success h2{
      margin:0 0 12px;
      font-size: clamp(22px, 3.2vw, 34px);
    }
    .vidwrap{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      border-radius: 18px;
      overflow:hidden;
      width:min(560px, 100%);
      margin: 0 auto;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    video{
      width:100%;
      height:auto;
      display:block;
    }
    .small{
      color: rgba(199,199,238,.9);
      margin-top:10px;
      font-size: 15px;
      white-space: pre-line;
    }

    .footer{
      margin-top:16px;
      text-align:center;
      color: rgba(199,199,238,.85);
      font-size: 13px;
    }

    canvas{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.95;
    }
  </style>
</head>

      <button class="btn" id="no" aria-label="No">No</button>
    </div>

    <div class="controls">
      <button class="btn" id="yes" aria-label="Yes">Yes</button>
    </div>

    <div class="success" id="success">
      <h2>Yesss 🥰</h2>

      <div class="vidwrap">

        </video>
      </div>

      <div class="small" id="message"></div>
    </div>

    <div class="footer">made with love (and a little cheating)</div>
  </div>
